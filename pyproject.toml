[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A from-zero, modular RAG system designed for MCP and agent integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
modular-rag = "modular_rag.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modular_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", ".github/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
