[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A modular RAG MCP server for personal knowledge management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "rag", "retrieval", "knowledge-base"]
dependencies = []

[project.scripts]
mcp-server = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
