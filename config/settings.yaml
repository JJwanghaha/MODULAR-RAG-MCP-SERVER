# 只保存非敏感配置；默认使用个人 Gemini，不配置公司网关或自动回退。
llm:
  provider: "gemini"  # openai / azure / deepseek / ollama / gemini
  model: "gemini-3.7-flash"  # 用户选择；账号可用性以真实验收为准。
  temperature: 0.0
  max_tokens: 4096
  timeout: 60.0
  # base_url: 可选服务地址；Azure 使用资源 endpoint。
  # deployment_name、api_version: Azure 可选连接参数；版本也可通过环境变量提供。

embedding:
  provider: "gemini"  # openai / azure / ollama / gemini
  model: "gemini-embedding-2"
  dimensions: 768
  timeout: 60.0
  # base_url、deployment_name、api_version 的规则与 llm 相同。

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: "none"
  model: "cross-encoder/ms-marco-MiniLM-L6-v2"  # 修正上游拼写；不自动下载权重。
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"
  # B6 CustomEvaluator 仅计算检索指标；忠实度评估在 H 阶段接入。

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 100
